# ========================================
# CONFIGURACION DEL SERVIDOR Y EXTERNOS
# ========================================
server.port={puerto_microservicio_propio}


# ========================================
# LOGGING
# ========================================
logging.level.root=INFO
logging.level.com.backend_tpi.{nombre_microservicio}=DEBUG
# logging.level.org.springframework=WARN
logging.level.org.springframework.web=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# logging.level.org.hibernate.orm.jdbc.bind=TRACE

# logging.file.name=logs/{nombre_microservicio}.log
# logging.file.max-size=5MB
# logging.file.max-history=7

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %level - %msg - %logger%n
# logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


# ========================================
# JSON / SERIALIZACION
# ========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Argentina/Buenos_Aires


# ========================================
# VALIDACION
# ========================================
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
